name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps CI minutes cheap; full requirements.txt would
          # pull GPU wheels we don't need for import smoke-tests.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pandas pillow scikit-image scikit-learn tifffile tqdm pyyaml anthropic fastapi jinja2 uvicorn aiofiles plotly segmentation-models-pytorch read-roi mahotas pytest

      - name: Run smoke tests
        run: |
          python -m pytest tests/ -v

      - name: Run import sweep
        run: |
          python scripts/import_check.py
