name: mito
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - torchaudio
  - pytorch-cuda=11.8
  - numpy=1.26.4
  - scipy=1.13.0
  - pandas=2.2.2
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - scikit-image=0.22.0
  - scikit-learn=1.4.2
  - h5py=3.11.0
  - tifffile
  - jupyter
  - pip
  - pip:
    - -r requirements.txt
